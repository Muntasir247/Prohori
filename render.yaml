# Render Infrastructure Blueprint for Prohori
# Web service + Managed PostgreSQL 16 database (Free tier compatible).
# Automatically provisions database with pgvector, applies migrations, and runs FastAPI backend.

databases:
  - name: prohori-db
    databaseName: prohori
    user: prohori
    plan: free # 1 GB storage, free for 30 days, no credit card required
    region: singapore # Lowest latency for Bangladesh
    postgresMajorVersion: "16"

services:
  - type: web
    name: prohori-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # Hobby free tier (or upgrade to starter for always-on 1GB RAM)
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: APP_ORIGIN
        value: https://theprohori.vercel.app
      - key: CORS_ORIGINS
        value: https://theprohori.vercel.app,https://sudo-sapians.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: prohori-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # Anthropic Claude API Key (sk-ant-...)
      - key: VOYAGE_API_KEY
        sync: false # Optional: Voyage AI Key (leave blank for deterministic keyword fallback)
      - key: NUMBER_HMAC_KEY
        generateValue: true # 256-bit cryptographically secure key for phone HMACs
      - key: SESSION_SECRET
        generateValue: true # 256-bit secret for session encryption and signing
      - key: RESEND_API_KEY
        sync: false # Optional: Resend API Key
      - key: EMAIL_DRIVER
        value: console # console or resend
      - key: ALLOW_CONSOLE_EMAIL_IN_PROD
        value: "true" # Permits console email driver in production for demos without Resend
      - key: TRUST_PROXY_HEADERS
        value: "true" # Extracts real client IP behind Render/Vercel reverse proxies
      - key: SENTRY_DSN
        sync: false # Optional: Sentry error reporting
      - key: SEED_USER_PASSWORD
        sync: false # Optional: demo user password for scripts/seed.py
      - key: SEED_REVIEWER_PASSWORD
        sync: false # Optional: demo reviewer password for scripts/seed.py
      - key: SEED_ADMIN_PASSWORD
        sync: false # Optional: demo admin password for scripts/seed.py
      - key: DAILY_LLM_SPEND_CAP_USD
        value: "25.0"
      - key: LOG_LEVEL
        value: INFO

