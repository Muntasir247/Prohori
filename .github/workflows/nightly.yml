name: Nightly Analytics & Campaign Clustering

on:
  schedule:
    # 02:00 AM Asia/Dhaka (UTC+6) daily — Doc 02 Section 14
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prohori-nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: Run app.jobs.nightly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run idempotent nightly batch job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NUMBER_HMAC_KEY: ${{ secrets.NUMBER_HMAC_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ENVIRONMENT: production
          ALLOW_CONSOLE_EMAIL_IN_PROD: "true"
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured in GitHub Actions; skipping live run."
            exit 0
          fi
          python -m app.jobs.nightly
