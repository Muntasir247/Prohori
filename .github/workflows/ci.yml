name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # The full requirements.txt pulls heavy native wheels (presidio, hdbscan)
        # not needed for the Phase 01 skeleton checks. Install the lean set the
        # app factory and tests actually import; expand as modules land.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115,<0.116" "pydantic>=2.9,<3" "pydantic-settings>=2.6,<3" \
            "SQLAlchemy[asyncio]>=2.0.36,<2.1" "aiosqlite>=0.20,<0.21" \
            "httpx>=0.27,<0.29" "pytest>=8.3,<9" "pytest-asyncio>=0.24,<0.25" \
            "ruff>=0.7,<0.9"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (eslint + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
